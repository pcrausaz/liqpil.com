<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kaclink ball with number and match check">
  <defs>
    <linearGradient id="sphere" x1="150" y1="150" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f9bff"/>
      <stop offset="0.45" stop-color="#6a5cf0"/>
      <stop offset="1" stop-color="#5839d7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#5839d7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5839d7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hi" cx="0.36" cy="0.30" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b1a75" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- glow halo -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <!-- sphere -->
  <circle cx="256" cy="256" r="150" fill="url(#sphere)"/>
  <circle cx="256" cy="256" r="150" fill="url(#hi)"/>

  <!-- lucky number -->
  <text x="256" y="258" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="150"
        fill="#ffffff" fill-opacity="0.96">7</text>

  <!-- subtle gold match badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="360" cy="360" r="48" fill="#EBC87E"/>
    <path d="M338 360 l15 15 l29 -32" fill="none" stroke="#4a3aa0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
